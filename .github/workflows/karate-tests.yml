name: Karate API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      karate_env:
        description: 'Environment where the test suite is executed'
        type: choice
        options: [ prod, dev, cert ]
        default: prod

permissions:
  contents: read

concurrency:
  group: karate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
    name: Functional Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4

      - name: JDK 21 Configuration
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Execution Karate Tests Suite
        run: >
          mvn -B --no-transfer-progress clean test
          -Dtest=ConduitTest
          -Dkarate.env=${{ inputs.karate_env || 'prod' }}

      - name: Upload Karate HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karate-reports-${{ github.run_number }}
          path: target/karate-reports/
          retention-days: 14
          if-no-files-found: warn

      - name: Run Summary
        if: always()
        run: |
          {
            echo "## Karate Suite Results"
            echo ""
            echo "| Entorno | Commit | Reporte |"
            echo "|---------|--------|---------|"
            echo "| \`${{ inputs.karate_env || 'prod' }}\` | \`${GITHUB_SHA::7}\` | artifact \`karate-reports-${{ github.run_number }}\` |"
            echo ""
            if ls target/surefire-reports/*.txt >/dev/null 2>&1; then
              echo '```'
              cat target/surefire-reports/*.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"